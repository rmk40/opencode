name: Sync Fork and Rebase Patches

on:
  schedule:
    - cron: "0 */2 * * *" # Every 2 hours
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  sync-and-rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sst/opencode.git || true
          git fetch upstream
          git fetch origin

      - name: Check for new release
        id: check
        run: |
          # Find latest release commit
          LATEST_RELEASE=$(git log upstream/dev --oneline --grep="^release: v" --max-count=1 --format="%H")
          LATEST_VERSION=$(git log $LATEST_RELEASE --oneline --format="%s" -1)

          # Get current base of rmk branch
          CURRENT_BASE=$(git merge-base origin/rmk upstream/dev)

          echo "Current base: $(git log $CURRENT_BASE --oneline --format="%s" -1)"
          echo "Latest release: $LATEST_VERSION"

          if [ "$CURRENT_BASE" = "$LATEST_RELEASE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Already based on latest release: $LATEST_VERSION"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            echo "base=$CURRENT_BASE" >> $GITHUB_OUTPUT
            echo "📥 New release detected: $LATEST_VERSION"
          fi

      - name: Sync dev with upstream
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout dev
          git reset --hard upstream/dev
          git push origin dev --force
          echo "✅ dev branch synced"

      - name: Rebase rmk onto latest release
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout rmk
          if git rebase --onto ${{ steps.check.outputs.release }} ${{ steps.check.outputs.base }} rmk; then
            git push origin rmk --force
            echo "✅ rmk rebased onto ${{ steps.check.outputs.version }}"
          else
            echo "❌ Rebase failed - manual intervention required"
            git rebase --abort
            exit 1
          fi
