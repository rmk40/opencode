name: Sync Fork and Rebase Patches

on:
  schedule:
    - cron: "0 */2 * * *" # Every 2 hours
  workflow_dispatch: # Manual trigger

jobs:
  sync-and-rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if upstream has new commits
        id: check
        run: |
          git remote add upstream https://github.com/sst/opencode.git || true
          git fetch upstream
          LOCAL=$(git rev-parse origin/dev)
          REMOTE=$(git rev-parse upstream/dev)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No new upstream commits"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New upstream commits detected"
          fi

      - name: Sync dev with upstream
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout dev
          git reset --hard upstream/dev
          git push origin dev --force

      - name: Rebase rmk onto dev
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout rmk
          git rebase dev
          git push origin rmk --force
